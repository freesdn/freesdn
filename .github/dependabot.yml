# FreeSDN - Dependabot configuration
# https://docs.github.com/en/code-security/dependabot
#
# ############################################################################
# #  DO NOT MERGE DEPENDABOT PRs ON THIS REPOSITORY. CLOSE THEM.             #
# ############################################################################
#
# Dependabot here is a NOTIFICATION mechanism, not a merge path. This repo is
# published by a flatten from a private monorepo, and the publisher seeds from
# origin/main and then runs `git add -A` over the flattened worktree. Anything
# present upstream but absent from the flatten is therefore staged as a REVERT.
#
# So a merged Dependabot PR SILENTLY UN-FIXES ITSELF on the very next release:
# the bump disappears, the CVE comes back, and the release that removed it looks
# like an ordinary content update. Nothing fails; nothing warns.
#
# The correct response to a PR opened here:
#   1. Read it - it is telling you a real bump exists.
#   2. Apply that bump in the PRIVATE monorepo (freesdn/backend, freesdn/frontend,
#      or the pinned SHA in the workflow), and run the gates there.
#   3. CLOSE the PR here without merging. The fix reaches users through the
#      flatten, not through this branch.
#
# An earlier version of this header called Dependabot "the managed path for
# keeping pinned actions and libraries current", which read as an invitation to
# merge. It was wrong and is corrected here.

version: 2
updates:
  # GitHub Actions pinned in .github/workflows. Surfaces bumps to the pinned
  # commit SHAs through review rather than trusting mutable tags silently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"

  # Python backend (Poetry)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # Container base images (Dockerfiles at the repo root)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"

  # Container base images (LogDB custom Dockerfile)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"

  # NOTE: the agent lives in the separate freesdn-agent repo, monitored by that
  # repo's own dependabot.yml — do NOT add a /agent entry here (this repo has no
  # /agent dir, so Dependabot would error on it).

  # Container base image — backend service Dockerfile FROM lines
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"

  # Container base image — frontend/edge Dockerfile FROM lines
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
