# =============================================================================
# FreeSDN - base stack (production-oriented, env-driven, profile-based)
# =============================================================================
# ONE base file drives every deployment tier. Select a tier with an env file;
# turn features on with profiles (set via COMPOSE_PROFILES in that env file):
#
#   Lite  (homelab):     docker compose --env-file .env.lite up -d
#   Pro   (SMB):         docker compose --env-file .env.pro  up -d
#   Max   (enterprise):  docker compose --env-file .env.max -f docker-compose.yml -f docker-compose.ha.yml up -d
#   Dev   (developer):   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Profiles (opt-in services):
#   caddy      → Caddy edge (default edge; in every tier's COMPOSE_PROFILES)
#   nginx      → nginx edge escape hatch (use INSTEAD of caddy)
#   io-worker  → dedicated I/O Celery worker (pro/max)
#   monitoring → Flower dashboard (pro/max)
#   cameras    → go2rtc camera restream sidecar (any tier that uses cameras)
#   pooling    → PgBouncer connection poolers (pro-optional/max)
#   dr         → off-site encrypted-backup sync (pro-optional/max)
#
# Core services (always on): postgres, logdb, redis, api, worker, scheduler,
# pg-backup. The data tier is INTERNAL ONLY - only the edge publishes host
# ports. (The dev overlay exposes DB/Redis/API ports for debugging.)

# ── Reusable fragments (YAML anchors) - kill per-service duplication ─────────
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: ${BACKEND_TARGET:-production}

# PostgreSQL stays on the Debian runtime, which is what makes an upgrade from
# 26.09.0 an image-only change: the existing volume is adopted in place, with no
# logical migration, no new volume and no locale change. See
# docker/postgres/UPGRADING.
#
# This default MUST stay a trixie tag. It is a build argument, so it overrides
# the Dockerfile's own default, and Dockerfile.postgres asserts
# VERSION_CODENAME=trixie -- an Alpine tag here does not quietly produce a musl
# image, it fails the build of every deployment that runs `compose build`.
# Cache and database wrappers apply supported OS updates at build time.
x-postgres-build: &postgres-build
  context: ./docker
  dockerfile: Dockerfile.postgres
  args:
    POSTGRES_VERSION: ${POSTGRES_VERSION:-18.6-trixie}
x-valkey-build: &valkey-build
  context: ./docker
  dockerfile: Dockerfile.valkey
  args:
    VALKEY_VERSION: ${VALKEY_VERSION:-9.1.2-alpine}

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freesdn}:${POSTGRES_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${POSTGRES_DB:-freesdn}
  LOGDB_URL: postgresql+asyncpg://${LOGDB_USER:-freesdn}:${LOGDB_PASSWORD}@${LOGDB_HOST:-logdb}:${LOGDB_PORT:-5432}/${LOGDB_DB:-freesdn_logs}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  GO2RTC_URL: ${GO2RTC_URL:-http://go2rtc:1984}
  SECRET_KEY: ${SECRET_KEY}
  # Optional auth-only rotation; keep SECRET_KEY/ENCRYPTION_SALT unchanged.
  # All API/worker/scheduler replicas must switch together while isolated.
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
  # Explicit public HTTPS origin for authenticated report-notice links.
  FRONTEND_URL: ${FRONTEND_URL:-}
  SLA_REPORT_DELIVERY_EPOCH: ${SLA_REPORT_DELIVERY_EPOCH:-}
  ENCRYPTION_SALT: ${ENCRYPTION_SALT}
  # Trusted same-origin vault confirmation callback; never derived from Host.
  VAULT_OIDC_REDIRECT_URI: ${VAULT_OIDC_REDIRECT_URI:-}
  # Production validates POSTGRES_PASSWORD as a standalone setting (not just in
  # DATABASE_URL); pass it (and LOGDB_PASSWORD) explicitly to every service.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  LOGDB_PASSWORD: ${LOGDB_PASSWORD}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  # TrueNAS/UniFi Protect: optional additional private CA, mounted read-only
  # into every connecting backend service. See docker/DEVICE-TLS.
  FREESDN_DEVICE_CA_BUNDLE: ${FREESDN_DEVICE_CA_BUNDLE:-}
  LOG_LEVEL: ${LOG_LEVEL:-WARNING}
  # Adapter write safety — one switch, two states. Default read-WRITE (false):
  # FreeSDN manages your gear out of the box, like pfSense/OPNsense/Omada/UniFi.
  # For a monitor-only deployment, set ADAPTER_READ_ONLY=true in .env (writes are
  # refused; an opt-in safety mode). Destructive ops (delete/destroy/factory-
  # reset) require an explicit per-action confirmation regardless of this flag.
  ADAPTER_READ_ONLY: ${ADAPTER_READ_ONLY:-false}
  # Persistent on-disk paths for the agent release-signing key store + binaries
  # and Proxmox ISO/template uploads. Point at /data subdirs (backed by named
  # volumes on api/worker) instead of the image default /var/lib/freesdn/* which
  # is on the read-only rootfs and unwritable by the non-root appuser.
  FREESDN_AGENT_RELEASE_DIR: ${FREESDN_AGENT_RELEASE_DIR:-/data/agent-releases}
  # New managed bytes use a marked private child of the existing release root.
  # An explicit override's parent must already exist on a shared persistent
  # volume. No startup adoption, chmod of old data, or implicit key generation.
  FREESDN_AGENT_MANAGED_RELEASE_DIR: ${FREESDN_AGENT_MANAGED_RELEASE_DIR:-}
  FREESDN_AGENT_RELEASE_GLOBAL_HISTORY_LIMIT: ${FREESDN_AGENT_RELEASE_GLOBAL_HISTORY_LIMIT:-10000}
  FREESDN_AGENT_RELEASE_ORG_HISTORY_LIMIT: ${FREESDN_AGENT_RELEASE_ORG_HISTORY_LIMIT:-2000}
  FREESDN_AGENT_RELEASE_GLOBAL_BYTE_LIMIT: ${FREESDN_AGENT_RELEASE_GLOBAL_BYTE_LIMIT:-53687091200}
  FREESDN_AGENT_RELEASE_ORG_BYTE_LIMIT: ${FREESDN_AGENT_RELEASE_ORG_BYTE_LIMIT:-10737418240}
  PROXMOX_UPLOAD_DIR: ${PROXMOX_UPLOAD_DIR:-/data/proxmox-uploads}
  # Metrics gate: set METRICS_AUTH_TOKEN to enable authenticated
  # /metrics scraping in prod/staging; unset → the endpoint is not served.
  ENABLE_METRICS: ${ENABLE_METRICS:-true}
  METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
  # Marketplace catalog signing gate. The publisher key is pinned by
  # default, so signature verification is ON out of the box: an unsigned or
  # tampered catalog is refused rather than ingested.
  #
  # registry.freesdn.org is live and serves the signed catalogue built by
  # registry/build.py. It previously named this host while nothing was attached
  # to it, so the shipped default made every first-run sync fail; the URL is the
  # same now because the registry behind it actually exists.
  #
  # Running your own registry: build it with registry/build.py --generate-key,
  # host registry/public/ anywhere, and override both values below with your
  # own URL and public key. Nothing in the protocol is specific to ours.
  MARKETPLACE_REGISTRY_URL: ${MARKETPLACE_REGISTRY_URL:-https://registry.freesdn.org/plugins.json}
  MARKETPLACE_PUBLISHER_PUBLIC_KEY: ${MARKETPLACE_PUBLISHER_PUBLIC_KEY:-580c30040c2eec36902d4ea9e778ee12cac270011703e9e9f8f7c617158711d5}
  MARKETPLACE_ALLOW_UNSIGNED: ${MARKETPLACE_ALLOW_UNSIGNED:-}
  # Keep this floor outside database backups; raise it before restoring an older DB.
  MARKETPLACE_MIN_SERIAL: ${MARKETPLACE_MIN_SERIAL:-0}
  # Hosts a PLUGIN's outbound HTTP may reach even when they are private/LAN.
  # Empty means public destinations only, which rules out most of what a
  # self-hosted operator would integrate with: their NetBox, Gotify, Grafana or
  # Home Assistant all live on their own network. Same contract as
  # FABRIC_WEBHOOK_ALLOWED_HOSTS: deploy-owner controlled, still DNS-pinned and
  # TLS-verified, cloud metadata never reachable.
  # Example: PLUGIN_HTTP_ALLOWED_HOSTS=netbox.lan,10.0.0.50
  PLUGIN_HTTP_ALLOWED_HOSTS: ${PLUGIN_HTTP_ALLOWED_HOSTS:-}
  # NetBird daemon address. In the sidecar topology the daemon runs in the `vpn`
  # container and the api/worker drive it via the `netbird` CLI over the SHARED
  # network namespace — so a tcp address (not the default unix socket, which the
  # app containers can't see) lets the CLI reach the daemon. The sidecar LISTENS
  # here, the app CLIs CONNECT here. Loopback inside the shared netns ⇒ private.
  NETBIRD_DAEMON_ADDR: ${NETBIRD_DAEMON_ADDR:-tcp://127.0.0.1:41731}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── PostgreSQL - primary relational DB (internal only) ─────────────────────
  postgres:
    build: *postgres-build
    image: ${POSTGRES_IMAGE:-freesdn-postgres:local}
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freesdn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-freesdn}
      POSTGRES_INITDB_ARGS: "${POSTGRES_INITDB_ARGS:---data-checksums}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker/postgres/custom.conf:/etc/postgresql/conf.d/custom.conf:ro
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-freesdn} -d $${POSTGRES_DB:-freesdn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-2G}
          cpus: '${POSTGRES_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${POSTGRES_MEM_RESERVATION:-256M}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── TimescaleDB - time-series / observability DB (internal only) ───────────
  logdb:
    build:
      context: ./docker
      dockerfile: Dockerfile.logdb
    image: ${LOGDB_IMAGE:-freesdn-logdb:local}
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    environment:
      POSTGRES_USER: ${LOGDB_USER:-freesdn}
      POSTGRES_PASSWORD: ${LOGDB_PASSWORD}
      POSTGRES_DB: ${LOGDB_DB:-freesdn_logs}
      POSTGRES_INITDB_ARGS: "${POSTGRES_INITDB_ARGS:---data-checksums}"
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    volumes:
      - logdb_data:/var/lib/postgresql
      - ./docker/postgres/logdb-custom.conf:/etc/postgresql/conf.d/custom.conf:ro
    shm_size: ${LOGDB_SHM_SIZE:-256m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-freesdn} -d $${POSTGRES_DB:-freesdn_logs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${LOGDB_MEM_LIMIT:-2G}
          cpus: '${LOGDB_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${LOGDB_MEM_RESERVATION:-256M}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── Valkey - broker + result backend + cache/pubsub (internal only) ────────
  # Valkey is the BSD-licensed, Linux-Foundation-governed fork of Redis 7.2 and
  # is a drop-in (same RESP protocol, same Sentinel, same redis-py clients). The
  # service is still keyed `redis` so REDIS_HOST/redis:// URLs are unchanged.
  redis:
    build: *valkey-build
    restart: unless-stopped
    # Keep the budget predictable; do not hide persistence pressure in swap.
    memswap_limit: ${REDIS_MEM_LIMIT:-768M}
    stop_grace_period: 30s
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # maxmemory-policy volatile-lru is deliberate for this SHARED cache+broker
    # instance: it only evicts keys that carry a TTL (cache entries, rate-limit,
    # the worker heartbeat) - never the TTL-less Celery task messages,
    # so under memory pressure regenerable data is shed first and queued tasks are
    # preserved (full → producers get a hard OOM error, not silent task loss). The
    # one cost is the heartbeat key can be evicted under pressure, which surfaces
    # as celery=degraded on the (non-gating) public health page. Max/HA currently
    # shares this policy across cache and broker databases; it does not deploy
    # a separate broker instance. Token revocation/refresh consumption is durable
    # in PostgreSQL and must never rely on the evictable TTL cache.
    command: >-
      valkey-server
      /usr/local/etc/valkey/valkey-custom.conf
      --appendonly yes
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    volumes:
      - redis_data:/data
      - type: bind
        source: ${REDIS_CONFIG_PATH:-./docker/redis/redis-custom.conf}
        target: /usr/local/etc/valkey/valkey-custom.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-768M}
          cpus: '${REDIS_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${REDIS_MEM_RESERVATION:-128M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── VPN overlay sidecar - the single PRIVILEGED overlay node ───────────────
  # Runs tailscaled (kernel TUN) + the NetBird daemon + the OpenVPN supervisor so
  # the hardened, non-root, read-only api/worker do NOT have to. Those services
  # join THIS container's network namespace (network_mode: "service:vpn") to
  # route to remote sites through the tunnels, and drive the daemons over shared
  # socket/config volumes. Reuses the backend image (which ships the VPN
  # binaries) with a VPN-only entrypoint. This is the ONE place that holds
  # NET_ADMIN + /dev/net/tun, keeping the elevated network privilege isolated.
  vpn:
    # OPT-IN privileged VPN sidecar (root + NET_ADMIN + /dev/net/tun). NOT started
    # by default — the controller is capless out of the box (matches Omada/UniFi).
    # Enable with: COMPOSE_PROFILES=vpn  AND  -f docker-compose.vpn.yml (which
    # rejoins the api to this sidecar's netns). See docs.freesdn.org.
    profiles: [vpn]
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    entrypoint: ["/app/vpn-sidecar-entrypoint.sh"]
    user: "0:0"
    restart: unless-stopped
    # NET_ADMIN (tun/wg/routes) on top of Docker's DEFAULT root capability set,
    # which is already a limited subset (no SYS_ADMIN/SYS_PTRACE/SYS_MODULE/…).
    # NOTE: do NOT cap_drop:[ALL] here — the sidecar (root) legitimately needs
    # CAP_DAC_OVERRIDE + CAP_CHOWN to read/chown the 0600 configs the non-root api
    # writes to the shared volumes; dropping them breaks config materialization +
    # status publishing. Blast-radius reduction for the api→root config channel is
    # instead handled by re-validating every config against the dangerous-directive
    # blocklist right before exec (see _ovpn_cfg_safe/_wg_cfg_safe below).
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      <<: *backend-env
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_run:/var/run/tailscale
      - netbird_state:/var/lib/netbird
      - netbird_config:/etc/netbird
      - openvpn_config:/etc/openvpn
      - vpn_run:/run/openvpn-client
      - wireguard_config:/etc/wireguard
      - wireguard_run:/run/wireguard
    healthcheck:
      # Probe that tailscaled actually RESPONDS, not just that its socket file
      # exists — a crashed/hung daemon leaves the socket on disk, so `test -S`
      # would report healthy while the overlay is silently dead. `status --json`
      # returns BackendState in any login state (incl. NeedsLogin) and fails only
      # if the daemon isn't answering.
      test: ["CMD-SHELL", "tailscale --socket=/var/run/tailscale/tailscaled.sock status --json 2>/dev/null | grep -q '\"BackendState\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging
    networks: [default]

  # ── API - FastAPI under gunicorn (internal; reached via the edge) ──────────
  api:
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    restart: unless-stopped
    stop_grace_period: ${API_STOP_GRACE_PERIOD:-40s}
    environment:
      <<: *backend-env
      # VPN is OFF by default (capless, no privileged sidecar). To enable the
      # privileged VPN sidecar, layer `-f docker-compose.vpn.yml` + set
      # COMPOSE_PROFILES=vpn — that overlay sets FREESDN_VPN_MODE=sidecar and
      # rejoins the api to the vpn netns. See docs.freesdn.org.
      VPN_MODE: ${VPN_MODE:-off}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      STRICT_STARTUP: ${STRICT_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://localhost"]}
      # SIZING (battle-tested): each gunicorn worker holds ~300-375MB of this app.
      # API_MEM_LIMIT must scale WITH this - rule of thumb API_MEM_LIMIT >=
      # WEB_CONCURRENCY*0.375G + 0.25G headroom. Default 2 workers fits the 1G
      # default; raising WEB_CONCURRENCY without raising API_MEM_LIMIT (below)
      # causes worker OOM-kill + churn under load.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-50}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-5}
      # Trust X-Forwarded-* only from the compose network (where the edge runs).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.0/16}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
    volumes:
      # NOTE: the VPN control volumes (tailscale_run / openvpn_config / vpn_run /
      # wireguard_config / wireguard_run) are added back by docker-compose.vpn.yml
      # only when the privileged VPN sidecar is enabled. Default api is capless.
      - fabric_artifacts:/data/fabric_artifacts
      - evidence_data:/data/evidence
      - agent_releases:/data/agent-releases
      - proxmox_uploads:/data/proxmox-uploads
      # Installed plugin packages (PLUGIN_DIR, default /data/plugins). Every
      # other /data path here has a named volume and this one did not, so plugin
      # files lived on the container's own layer: any `compose up -d` after an
      # image update wiped every installed plugin while the database still
      # reported them installed and active. The routes were simply gone and
      # nothing said so. The worker and scheduler mount it too, because a task
      # that touches a plugin package needs the same files the api unpacked.
      - plugin_data:/data/plugins
      # app/services/firmware.py:30 hardcodes FIRMWARE_DIR = /data/freesdn_firmware
      # and writes uploaded images there. The image pre-creates that directory, but
      # nothing mounted it -- and every backend service ships read_only: true, so the
      # write hit the read-only image layer with EROFS. Firmware images also need to
      # survive a container restart, which an image-layer path cannot do.
      - firmware_data:/data/freesdn_firmware
      # ── Four more paths the code writes that nothing used to mount ─────────
      # The Celery queue split is env-driven (WORKER_QUEUES / WORKER_IO_QUEUES),
      # so any task can land on EITHER worker: all four are mounted on api,
      # worker and worker-io.
      #
      # app/services/backup.py:344 - LocalStorageBackend("/data/backups") is the
      # fallback whenever a Backup/BackupSchedule has no storage_location_id
      # (both columns are nullable, models.py:164/:314), i.e. the shipped
      # "Local Storage" destination. save() does mkdir(parents=True) first, so on
      # the read-only rootfs every out-of-the-box backup died with
      # "[Errno 30] Read-only file system: '/data/backups'" and the row was
      # stamped FAILED. api runs POST /backups inline; the worker runs
      # backup.run_scheduled (queue "default") every 15 minutes.
      - backup_data:/data/backups
      # app/services/sla_reports.py:35 renders CSV/PDF under SLA_REPORTS_DIR
      # (default /data/sla_reports). Worse than a 500: generate_report SWALLOWS
      # the render failure (:236-245), so the row committed with file_path NULL
      # and the download endpoint quietly served raw JSON instead of a CSV
      # FileResponse. app/tasks/sla.py runs the scheduled variant on the
      # "metrics" queue, which is worker-io in pro/max and worker in lite.
      - sla_reports:/data/sla_reports
      # app/modules/voip/provisioning.py:44 writes handset configs to
      # /data/provisioning/voip. Its mkdir raises OSError, which is NOT the
      # ProvisioningError the callers catch (api.py:810, provisioning.py:473),
      # so both POST /voip/phones/{id}/provision and the unauthenticated
      # handset-facing GET /voip/provisioning/cfg{MAC}.xml returned 500 on every
      # request instead of a config. voip.generate_provisioning_files has no
      # task_route, so it runs on "default" (the worker).
      - voip_provisioning:/data/provisioning/voip
      # app/services/import_export.py:39 hardcodes DATA_DIR = /tmp/freesdn_data,
      # and /tmp is a PRIVATE per-container tmpfs on every backend service. The
      # api wrote the uploaded import file into its own tmpfs and handed the
      # absolute path to run_import_job, which executes in the worker where it
      # does not exist -> "Import file not found". Export was the mirror image:
      # the worker wrote the file, the api's download 404'd. A named volume at
      # that exact path gives both containers ONE directory. It is deliberately
      # mounted UNDER the tmpfs: the constant has no env override to point
      # somewhere tidier, and a nested named volume takes precedence over the
      # tmpfs beneath it.
      - import_export_data:/tmp/freesdn_data
      # Shared local media and private coordinator socket for API workers and
      # the api-2 service inherited by the single-host HA overlay.
      - hls_media:/tmp/freesdn-hls
    depends_on:
      postgres: {condition: service_healthy}
      logdb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1G}
          cpus: '${API_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${API_MEM_RESERVATION:-256M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    # api has NO networks/network_mode key -> it joins the project default network
    # (freesdn-network) and is reachable as `api:8000`. The optional VPN overlay
    # (docker-compose.vpn.yml) re-adds `network_mode: service:vpn` to route the api
    # through the privileged sidecar's overlay tunnels when VPN is enabled.

  # ── Celery worker - quick/priority lane (lite: ALL queues via WORKER_QUEUES) ─
  worker:
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-60s}
    environment:
      <<: *backend-env
    # Share the release-signing key store + upload dirs with the api so a task
    # that touches them never hits the read-only rootfs (the env anchor points
    # every backend service at these paths).
    volumes:
      - agent_releases:/data/agent-releases
      - proxmox_uploads:/data/proxmox-uploads
      - plugin_data:/data/plugins
      # app/services/firmware.py:30 hardcodes FIRMWARE_DIR = /data/freesdn_firmware
      # and writes uploaded images there. The image pre-creates that directory, but
      # nothing mounted it -- and every backend service ships read_only: true, so the
      # write hit the read-only image layer with EROFS. Firmware images also need to
      # survive a container restart, which an image-layer path cannot do.
      - firmware_data:/data/freesdn_firmware
      # Legal-hold evidence export runs HERE, not in api: app/tasks/cameras.py's
      # _archive_evidence says so in its own docstring ("Runs in a Celery
      # worker") and does os.makedirs(settings.EVIDENCE_DIR) at :324. Only api
      # mounted evidence_data, and every backend service has read_only: true, so
      # the export failed with EROFS on the shipped compose and the archive row
      # was stamped failed. It works in dev only because docker-compose.dev.yml
      # sets read_only: false, where the write lands on the container's own
      # layer and is lost when the container is recreated -- which is why this
      # was invisible.
      - evidence_data:/data/evidence
      # Same four paths the api mounts, and for the same reason: the queue split
      # is env-driven, so backup.run_scheduled (queue "default"),
      # app.tasks.sla.generate_scheduled_reports ("metrics"),
      # voip.generate_provisioning_files ("default") and data.run_import_job /
      # data.run_export_job ("default") can all execute here. See the api
      # service for the failure each one produced while unmounted.
      - backup_data:/data/backups
      - sla_reports:/data/sla_reports
      - voip_provisioning:/data/provisioning/voip
      - import_export_data:/tmp/freesdn_data
    depends_on:
      postgres: {condition: service_healthy}
      logdb: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    entrypoint: []
    command: >-
      celery -A app.core.celery_app worker
      --loglevel=${CELERY_LOGLEVEL:-warning}
      --pool=${CELERY_POOL:-prefork}
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-1000}
      --pidfile=/tmp/celery_worker.pid
      -Q ${WORKER_QUEUES:-default,priority}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery_worker.pid && kill -0 $$(cat /tmp/celery_worker.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-1G}
          cpus: '${WORKER_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${WORKER_MEM_RESERVATION:-256M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    # NO `networks:` key on purpose (it joins the project default network anyway
    # and is reachable as `worker`). The key is omitted so docker-compose.vpn.yml
    # can add `network_mode: service:vpn` -- compose rejects a service that
    # declares both ("mutually exclusive `network_mode` and `networks`"), and an
    # override file cannot delete a key. Same reason `api` has no networks key.
    # The worker MUST be able to enter the sidecar netns: every VPN beat task
    # (vpn.sync_vpn_connections / check_vpn_health / auto_reconnect /
    # check_tunnel_health) runs on the `sync` queue, which this worker consumes
    # in lite (WORKER_QUEUES=default,priority,discovery,sync,metrics).

  # ── Celery I/O worker - slow adapter/scan/metrics lane (pro/max) ───────────
  worker-io:
    profiles: [io-worker]
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-60s}
    environment:
      <<: *backend-env
    volumes:
      - agent_releases:/data/agent-releases
      - proxmox_uploads:/data/proxmox-uploads
      - plugin_data:/data/plugins
      # app/services/firmware.py:30 hardcodes FIRMWARE_DIR = /data/freesdn_firmware
      # and writes uploaded images there. The image pre-creates that directory, but
      # nothing mounted it -- and every backend service ships read_only: true, so the
      # write hit the read-only image layer with EROFS. Firmware images also need to
      # survive a container restart, which an image-layer path cannot do.
      - firmware_data:/data/freesdn_firmware
      # Legal-hold evidence export runs HERE, not in api: app/tasks/cameras.py's
      # _archive_evidence says so in its own docstring ("Runs in a Celery
      # worker") and does os.makedirs(settings.EVIDENCE_DIR) at :324. Only api
      # mounted evidence_data, and every backend service has read_only: true, so
      # the export failed with EROFS on the shipped compose and the archive row
      # was stamped failed. It works in dev only because docker-compose.dev.yml
      # sets read_only: false, where the write lands on the container's own
      # layer and is lost when the container is recreated -- which is why this
      # was invisible.
      - evidence_data:/data/evidence
      # Same four paths the api mounts, and for the same reason: the queue split
      # is env-driven, so backup.run_scheduled (queue "default"),
      # app.tasks.sla.generate_scheduled_reports ("metrics"),
      # voip.generate_provisioning_files ("default") and data.run_import_job /
      # data.run_export_job ("default") can all execute here. See the api
      # service for the failure each one produced while unmounted.
      - backup_data:/data/backups
      - sla_reports:/data/sla_reports
      - voip_provisioning:/data/provisioning/voip
      - import_export_data:/tmp/freesdn_data
    depends_on:
      postgres: {condition: service_healthy}
      logdb: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    entrypoint: []
    command: >-
      celery -A app.core.celery_app worker
      --loglevel=${CELERY_LOGLEVEL:-warning}
      --pool=${CELERY_IO_POOL:-prefork}
      --concurrency=${CELERY_IO_CONCURRENCY:-2}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-1000}
      --pidfile=/tmp/celery_worker_io.pid
      -Q ${WORKER_IO_QUEUES:-discovery,sync,metrics}
      -n worker-io@%h
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery_worker_io.pid && kill -0 $$(cat /tmp/celery_worker_io.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${WORKER_IO_MEM_LIMIT:-1G}
          cpus: '${WORKER_IO_CPU_LIMIT:-2.0}'
        reservations:
          memory: ${WORKER_IO_MEM_RESERVATION:-256M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    # NO `networks:` key -- see the note on `worker`. In pro/max this service
    # owns WORKER_IO_QUEUES=discovery,sync,metrics, so it is the process that
    # actually runs the VPN tasks and every adapter call that targets a
    # remote-site address; docker-compose.vpn.yml puts it in the sidecar netns.

  # ── Celery beat - periodic task scheduler (single instance) ────────────────
  scheduler:
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-env
    depends_on:
      redis: {condition: service_healthy}
      logdb: {condition: service_healthy}
      worker: {condition: service_healthy}
    # Persist the beat schedule (last-run timestamps) across restarts. On tmpfs
    # it was lost on every restart, so PersistentScheduler re-evaluated from
    # scratch and could re-fire all periodic tasks at once (a thundering herd).
    volumes:
      - celerybeat_data:/app/celerybeat
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=warning", "--scheduler", "celery.beat:PersistentScheduler", "--schedule=/app/celerybeat/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/celerybeat/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${SCHEDULER_MEM_LIMIT:-512M}
          cpus: '${SCHEDULER_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${SCHEDULER_MEM_RESERVATION:-128M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── Collector - dedicated SNMP-trap / Syslog / NetFlow UDP listener ────────
  # The receivers also run inside the API process (module on_start), but that
  # path cannot reliably accept EXTERNAL UDP: multi-worker gunicorn lets only one
  # worker bind a port, and the capless / read-only / non-root API container
  # cannot bind privileged 514/162 at all. This single dedicated process binds
  # them deterministically. It stays non-root; a namespaced sysctl lets the
  # appuser bind low ports without granting any capability or running as root.
  # Opt in with the `collector` profile (it publishes the UDP ports below):
  #   docker compose --env-file .env.pro --profile collector up -d
  collector:
    profiles: [collector]
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      <<: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      logdb: {condition: service_healthy}
      redis: {condition: service_healthy}
    entrypoint: []
    command: ["python", "-m", "app.modules.collector.run"]
    # Publish the receivers to the host. COLLECTOR_*_PORT is the single source of
    # truth for the listen port — the runner binds it and it is published on BOTH
    # sides, so the host-published and container-bound ports can never diverge
    # (default 514/162/2055; set e.g. COLLECTOR_SYSLOG_PORT=5514 to move one).
    ports:
      - "${COLLECTOR_SYSLOG_PORT:-514}:${COLLECTOR_SYSLOG_PORT:-514}/udp"
      - "${COLLECTOR_SNMP_PORT:-162}:${COLLECTOR_SNMP_PORT:-162}/udp"
      - "${COLLECTOR_NETFLOW_PORT:-2055}:${COLLECTOR_NETFLOW_PORT:-2055}/udp"
    # Namespaced (per-netns) — lets the non-root appuser bind 514/162 without
    # CAP_NET_BIND_SERVICE or root. Safe; affects only this container's netns.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; f=os.getenv('COLLECTOR_HEARTBEAT_FILE','/tmp/collector.alive'); sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${COLLECTOR_MEM_LIMIT:-512M}
          cpus: '${COLLECTOR_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${COLLECTOR_MEM_RESERVATION:-128M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── Flower - Celery monitoring dashboard (pro/max; internal) ───────────────
  flower:
    profiles: [monitoring]
    build: *backend-build
    image: ${BACKEND_IMAGE:-freesdn-backend:local}
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
      FLOWER_PORT: 5555
    depends_on:
      redis: {condition: service_healthy}
      worker: {condition: service_healthy}
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "flower", "--port=5555"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',5555)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${FLOWER_MEM_LIMIT:-512M}
          cpus: '${FLOWER_CPU_LIMIT:-0.5}'
        reservations:
          memory: ${FLOWER_MEM_RESERVATION:-128M}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── go2rtc - camera RTSP→MSE/WebRTC restream (feature: cameras) ────────────
  go2rtc:
    profiles: [cameras]
    build:
      context: ./docker
      dockerfile: Dockerfile.go2rtc
    image: ${GO2RTC_IMAGE:-freesdn-go2rtc:local}
    restart: unless-stopped
    init: true
    volumes:
      - go2rtc_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1984/api/streams >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${GO2RTC_MEM_LIMIT:-1G}
          cpus: '${GO2RTC_CPU_LIMIT:-2.0}'
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── Edge: Caddy (DEFAULT, always on) - TLS + SPA + /api proxy (HTTP/WS/streams)
  # To use the nginx escape hatch instead: enable the `nginx` profile AND keep
  # this from starting with `--scale edge=0`. The dev overlay disables it (dev
  # serves the SPA via the Vite HMR server).
  edge:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: caddy
    image: ${EDGE_IMAGE:-freesdn-edge:local}
    restart: unless-stopped
    init: true
    environment:
      # :80 → HTTP (behind LB / local). A hostname → auto-HTTPS (Let's Encrypt).
      # localhost/127.0.0.1 → HTTPS via Caddy's internal CA. See ./frontend/Caddyfile.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      # Default: api is a normal bridge service reachable as api:8000. The VPN
      # overlay flips this to vpn:8000 (api shares the sidecar's netns there).
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy_data:/data      # certs + ACME state - MUST persist (LE rate limits)
      - caddy_config:/config
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
      - "${EDGE_HTTPS_PORT:-8443}:443"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # curl WITHOUT -L, on purpose. Caddy's automatic HTTPS installs a global
      # HTTP->HTTPS redirect on :80 as soon as CADDY_SITE_ADDRESS is a hostname
      # or `localhost` - which is the shipped pro/max value (.env.pro.example:34,
      # .env.max.example:46) and what install.sh:181 picks on a fresh install
      # with no --domain. The old busybox `wget -qO- http://127.0.0.1/health`
      # followed that 308 to https://127.0.0.1/, where the handshake fails
      # because Caddy holds no certificate for the IP - so wget exited 1 and the
      # edge reported `unhealthy` FOREVER while serving traffic perfectly.
      # scripts/selfheal.py treats that as a fault: --check exits 1, --up times
      # out, and --monitor restarts a healthy edge until it quarantines it.
      # `curl -fsS` without -L accepts the 308 as the correct answer for a
      # TLS-terminating Caddy and still fails on 4xx/5xx or connection refused
      # (verified in all three CADDY_SITE_ADDRESS modes against
      # caddy:2.11.4-alpine, the pinned edge base). install.sh:238 already
      # probes this way, which is why the installer never surfaced the bug.
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${EDGE_MEM_LIMIT:-512M}
          cpus: '${EDGE_CPU_LIMIT:-1.0}'
        reservations:
          memory: ${EDGE_MEM_RESERVATION:-64M}
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── Edge: nginx escape hatch (opt-in; use INSTEAD of caddy) ────────────────
  # Enable with COMPOSE_PROFILES=nginx (and DROP caddy). Intended for shops that
  # standardize on nginx or terminate TLS upstream (SSL_MODE=off behind an LB).
  edge-nginx:
    profiles: [nginx]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: ${EDGE_NGINX_IMAGE:-freesdn-edge-nginx:local}
    restart: unless-stopped
    init: true
    environment:
      SSL_MODE: ${SSL_MODE:-off}
    volumes:
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    ports:
      - "${EDGE_HTTP_PORT:-8080}:8080"
      - "${EDGE_HTTPS_PORT:-8443}:8443"
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=999,gid=999
      - /var/run:uid=999,gid=999
      - /tmp:uid=999,gid=999
      - /etc/nginx/conf.d:uid=999,gid=999
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── PgBouncer - connection poolers (feature: pooling; pro-opt/max) ─────────
  pgbouncer:
    profiles: [pooling]
    build:
      context: ./docker
      dockerfile: Dockerfile.pgbouncer
      args:
        PGBOUNCER_VERSION: ${PGBOUNCER_VERSION:-v1.25.2-p0}
    image: ${PGBOUNCER_IMAGE:-freesdn-pgbouncer:local}
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    environment:
      PGBOUNCER_USER: ${POSTGRES_USER:-freesdn}
      PGBOUNCER_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_CONFIG: /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-freesdn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      # uid/gid 70, NOT 999. edoburu/pgbouncer is Alpine-based and its USER is
      # `postgres` = uid 70; 999 is the DEBIAN postgres uid (and is right for
      # edge-nginx above, whose image really does create uid 999). With 999 here
      # the tmpfs came up owned by a user the process is not, the entrypoint's
      # `echo ... > /etc/pgbouncer/userlist.txt` failed with EACCES, `set -e`
      # killed it, and pgbouncer restart-looped -- which took the WHOLE max/ha
      # stack down with it, because api's DATABASE_URL points at `pgbouncer` and
      # the name never resolved. Verified against the image: `id -u` is 70.
      - /etc/pgbouncer:uid=70,gid=70
      - /var/run/pgbouncer:uid=70,gid=70
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  pgbouncer-logdb:
    profiles: [pooling]
    build:
      context: ./docker
      dockerfile: Dockerfile.pgbouncer
      args:
        PGBOUNCER_VERSION: ${PGBOUNCER_VERSION:-v1.25.2-p0}
    image: ${PGBOUNCER_IMAGE:-freesdn-pgbouncer:local}
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    environment:
      PGBOUNCER_USER: ${LOGDB_USER:-freesdn}
      PGBOUNCER_PASSWORD: ${LOGDB_PASSWORD}
      PGBOUNCER_CONFIG: /etc/pgbouncer/pgbouncer-logdb.ini
    volumes:
      - ./docker/pgbouncer/pgbouncer-logdb.ini:/etc/pgbouncer/pgbouncer-logdb.ini:ro
      - ./docker/pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      logdb: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${LOGDB_USER:-freesdn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      # uid/gid 70, NOT 999. edoburu/pgbouncer is Alpine-based and its USER is
      # `postgres` = uid 70; 999 is the DEBIAN postgres uid (and is right for
      # edge-nginx above, whose image really does create uid 999). With 999 here
      # the tmpfs came up owned by a user the process is not, the entrypoint's
      # `echo ... > /etc/pgbouncer/userlist.txt` failed with EACCES, `set -e`
      # killed it, and pgbouncer restart-looped -- which took the WHOLE max/ha
      # stack down with it, because api's DATABASE_URL points at `pgbouncer` and
      # the name never resolved. Verified against the image: `id -u` is 70.
      - /etc/pgbouncer:uid=70,gid=70
      - /var/run/pgbouncer:uid=70,gid=70
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── pg-backup - encrypted pg_dump of both DBs (core; fail-closed in prod) ──
  pg-backup:
    build: *postgres-build
    image: ${POSTGRES_IMAGE:-freesdn-postgres:local}
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    environment:
      # HOME on the writable tmpfs (read_only rootfs → /root is not writable).
      HOME: /tmp
      PGUSER: ${POSTGRES_USER:-freesdn}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      LOGDB_USER: ${LOGDB_USER:-freesdn}
      LOGDB_PASS: ${LOGDB_PASSWORD}
      LOGDB_DB: ${LOGDB_DB:-freesdn_logs}
      POSTGRES_DB: ${POSTGRES_DB:-freesdn}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      # Fail-closed by default. Set to 1 ONLY for dev/homelab to allow
      # unencrypted dumps when no GPG recipient is configured.
      BACKUP_ALLOW_PLAINTEXT: ${BACKUP_ALLOW_PLAINTEXT:-0}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # A completed pair must be younger than the interval plus this grace.
      BACKUP_FRESHNESS_GRACE_SECONDS: ${BACKUP_FRESHNESS_GRACE_SECONDS:-7200}
    volumes:
      - pg_backups:/backups
      - ${BACKUP_GPG_PUBLIC_KEY_PATH:-./secrets/.gitkeep}:/etc/freesdn/gpg/backup-public.asc:ro
    depends_on:
      postgres: {condition: service_healthy}
      logdb: {condition: service_healthy}
    entrypoint: >-
      /bin/bash -c '
      set -eo pipefail;
      mkdir -p /backups/.metrics;
      LAST_SUCCESS=$$(awk "\$$1 == \"freesdn_pg_backup_last_success_timestamp\" {print \$$2}" /backups/.metrics/pg_backup.prom 2>/dev/null || true);
      case "$$LAST_SUCCESS" in ""|*[!0-9]*) LAST_SUCCESS=0;; esac;
      write_metrics() {
        printf "freesdn_pg_backup_enabled %s\nfreesdn_pg_backup_encryption_enabled %s\nfreesdn_pg_backup_last_attempt_failed %s\nfreesdn_pg_backup_last_success_timestamp %s\n" "$$BACKUP_ENABLED" "$${GPG_ENABLED:-0}" "$$1" "$$LAST_SUCCESS" > /backups/.metrics/pg_backup.prom.tmp;
        mv /backups/.metrics/pg_backup.prom.tmp /backups/.metrics/pg_backup.prom;
      };
      BACKUP_ENABLED=1;
      printf "postgres:*:*:%s:%s\n" "$$PGUSER" "$$PG_PASSWORD" > ~/.pgpass;
      printf "logdb:*:*:%s:%s\n" "$$LOGDB_USER" "$$LOGDB_PASS" >> ~/.pgpass;
      chmod 600 ~/.pgpass;
      unset PG_PASSWORD LOGDB_PASS;
      export GNUPGHOME=/tmp/gnupg;
      mkdir -p $$GNUPGHOME; chmod 700 $$GNUPGHOME;
      GPG_KEY=/etc/freesdn/gpg/backup-public.asc;
      GPG_ENABLED=0;
      if [ -n "$$BACKUP_GPG_RECIPIENT" ] && [ -s "$$GPG_KEY" ] && gpg --batch --import "$$GPG_KEY" >/tmp/gpg-import.log 2>&1; then
        GPG_ENABLED=1;
        echo "GPG backup encryption ENABLED - recipient: $$BACKUP_GPG_RECIPIENT";
      elif [ -n "$$BACKUP_GPG_RECIPIENT" ]; then
        echo "WARNING: GPG requested but key import FAILED; see /tmp/gpg-import.log. Backups would be UNENCRYPTED.";
      else
        echo "GPG not configured (set BACKUP_GPG_RECIPIENT + BACKUP_GPG_PUBLIC_KEY_PATH to enable).";
      fi;
      if [ "$$GPG_ENABLED" != "1" ] && [ "$${BACKUP_ALLOW_PLAINTEXT:-0}" != "1" ]; then
        echo "Backups DISABLED: no encryption configured and BACKUP_ALLOW_PLAINTEXT is not set. Refusing to write plaintext dumps (secure by default).";
        echo "  Enable: set BACKUP_GPG_RECIPIENT + a valid BACKUP_GPG_PUBLIC_KEY_PATH, or set BACKUP_ALLOW_PLAINTEXT=1 (not recommended), then re-up.";
        BACKUP_ENABLED=0;
        write_metrics 0;
        echo "Idling - container stays up but writes no backups until reconfigured (no crash-loop).";
        while true; do sleep 3600; done;
      fi;
      echo "FreeSDN DB Backup service started (interval $${BACKUP_INTERVAL_SECONDS}s, retention $${BACKUP_RETENTION_DAYS}d)";
      while true; do
        STAMP=$$(date +%Y%m%d_%H%M%S);
        cleanup_partial() { rm -f /backups/freesdn_$$STAMP.sql.gz.partial /backups/logdb_$$STAMP.sql.gz.partial /backups/freesdn_$$STAMP.sql.gz.gpg.partial /backups/logdb_$$STAMP.sql.gz.gpg.partial; };
        backup_exit() { result=$$?; cleanup_partial; if [ "$$result" != 0 ]; then write_metrics 1; fi; exit "$$result"; };
        trap backup_exit EXIT;
        if [ "$$GPG_ENABLED" = "1" ]; then
          pg_dump -h postgres -U $$PGUSER -d $${POSTGRES_DB:-freesdn} --no-owner --no-privileges | gzip | gpg --batch --yes --trust-model always --encrypt --recipient "$$BACKUP_GPG_RECIPIENT" --output /backups/freesdn_$$STAMP.sql.gz.gpg.partial;
          pg_dump -h logdb -U $$LOGDB_USER -d $$LOGDB_DB --no-owner --no-privileges | gzip | gpg --batch --yes --trust-model always --encrypt --recipient "$$BACKUP_GPG_RECIPIENT" --output /backups/logdb_$$STAMP.sql.gz.gpg.partial;
          mv /backups/freesdn_$$STAMP.sql.gz.gpg.partial /backups/freesdn_$$STAMP.sql.gz.gpg;
          mv /backups/logdb_$$STAMP.sql.gz.gpg.partial /backups/logdb_$$STAMP.sql.gz.gpg;
        else
          pg_dump -h postgres -U $$PGUSER -d $${POSTGRES_DB:-freesdn} --no-owner --no-privileges | gzip > /backups/freesdn_$$STAMP.sql.gz.partial;
          pg_dump -h logdb -U $$LOGDB_USER -d $$LOGDB_DB --no-owner --no-privileges | gzip > /backups/logdb_$$STAMP.sql.gz.partial;
          mv /backups/freesdn_$$STAMP.sql.gz.partial /backups/freesdn_$$STAMP.sql.gz;
          mv /backups/logdb_$$STAMP.sql.gz.partial /backups/logdb_$$STAMP.sql.gz;
        fi;
        find /backups \( -name "*.sql.gz" -o -name "*.sql.gz.gpg" -o -name "*.partial" \) -mtime +$${BACKUP_RETENTION_DAYS:-7} -delete;
        mkdir -p /backups/.metrics;
        LAST_SUCCESS=$$(date +%s);
        EXTENSION=sql.gz; if [ "$$GPG_ENABLED" = 1 ]; then EXTENSION=sql.gz.gpg; fi;
        printf "%s %s %s\n" "$$LAST_SUCCESS" "$$STAMP" "$$EXTENSION" > /backups/.metrics/pg_backup.last_success.tmp;
        mv /backups/.metrics/pg_backup.last_success.tmp /backups/.metrics/pg_backup.last_success;
        write_metrics 0;
        trap - EXIT;
        echo "[$$STAMP] Backup complete. Next run in $${BACKUP_INTERVAL_SECONDS}s.";
        sleep $${BACKUP_INTERVAL_SECONDS:-86400};
      done'
    read_only: true
    # The shared PostgreSQL image declares this data-directory VOLUME, but the
    # backup client never runs a database. Mask it so container recreation does
    # not allocate and abandon an unused anonymous database volume each time.
    tmpfs: [/tmp, /var/lib/postgresql]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          read -r success batch extension < /backups/.metrics/pg_backup.last_success || exit 1;
          case "$$batch" in ""|*[!0-9_]*) exit 1;; esac;
          case "$$extension" in sql.gz|sql.gz.gpg) ;; *) exit 1;; esac;
          test -s "/backups/freesdn_$${batch}.$${extension}" &&
          test -s "/backups/logdb_$${batch}.$${extension}" &&
          awk -v now="$$(date +%s)" -v pointer="$$success" -v interval="$${BACKUP_INTERVAL_SECONDS:-86400}"
          -v grace="$${BACKUP_FRESHNESS_GRACE_SECONDS:-7200}"
          "BEGIN {valid=1}
          \$$1 == \"freesdn_pg_backup_enabled\" {enabled=\$$2; ec++}
          \$$1 == \"freesdn_pg_backup_last_attempt_failed\" {failed=\$$2; fc++}
          \$$1 == \"freesdn_pg_backup_last_success_timestamp\" {stamp=\$$2; sc++; if (\$$2 !~ /^[0-9]+$$/) valid=0}
          END {exit !(valid && ec==1 && fc==1 && sc==1 && enabled==1 && failed==0
          && interval ~ /^[0-9]+$$/ && interval>0 && grace ~ /^[0-9]+$$/
          && pointer ~ /^[0-9]+$$/ && stamp==pointer && stamp>0 && stamp<=now && now-stamp<=interval+grace)}"
          /backups/.metrics/pg_backup.prom
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks: [default]

  # ── pg-backup-offsite - rclone copy to remote storage (feature: dr) ────────
  pg-backup-offsite:
    profiles: [dr]
    build:
      context: ./docker
      dockerfile: Dockerfile.rclone
    image: ${RCLONE_IMAGE:-freesdn-rclone:local}
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    environment:
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      BACKUP_OFFSITE_PATH: ${BACKUP_OFFSITE_PATH:-freesdn-backups}
      BACKUP_OFFSITE_INTERVAL_HOURS: ${BACKUP_OFFSITE_INTERVAL_HOURS:-24}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_FRESHNESS_GRACE_SECONDS: ${BACKUP_FRESHNESS_GRACE_SECONDS:-7200}
    volumes:
      - pg_backups:/backups:ro
      - pg_backup_offsite_status:/offsite-status
      - ./docker/backup-offsite.sh:/opt/freesdn/backup-offsite.sh:ro
      - ./docker/backup-offsite-health.sh:/opt/freesdn/backup-offsite-health.sh:ro
      - ${BACKUP_OFFSITE_CONFIG_PATH:-./secrets/rclone.conf}:/config/rclone/rclone.conf:ro
    depends_on:
      pg-backup: {condition: service_started}
    entrypoint: ["/bin/sh", "/opt/freesdn/backup-offsite.sh"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/freesdn/backup-offsite-health.sh"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp
      - /home/rclone/.config/rclone
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  # ── Observability stack (feature: metrics) - Prometheus + exporters ─────────
  # Enable with `metrics` in COMPOSE_PROFILES. Scrapes the API /metrics + Valkey
  # + Postgres/LogDB exporters and loads observability/prometheus/alerts.yml. Add an
  # Alertmanager + your channel to route the alerts.
  prometheus:
    profiles: [metrics]
    build:
      context: ./docker
      dockerfile: Dockerfile.prometheus
    image: ${PROMETHEUS_IMAGE:-freesdn-prometheus:local}
    restart: unless-stopped
    user: "65534:65534"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/freesdn-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-1G}
          cpus: '${PROMETHEUS_CPU_LIMIT:-1.0}'
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  backup-metrics:
    profiles: [metrics]
    build:
      context: ./docker
      dockerfile: Dockerfile.backup-metrics
    restart: unless-stopped
    init: true
    user: "65534:65534"
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_FRESHNESS_GRACE_SECONDS: ${BACKUP_FRESHNESS_GRACE_SECONDS:-7200}
      BACKUP_OFFSITE_INTERVAL_HOURS: ${BACKUP_OFFSITE_INTERVAL_HOURS:-24}
      # Set to 1 when enabling dr via --profile instead of COMPOSE_PROFILES.
      BACKUP_OFFSITE_REQUIRED: ${BACKUP_OFFSITE_REQUIRED:-0}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - pg_backups:/backups:ro
      - pg_backup_offsite_status:/offsite-status:ro
    read_only: true
    cap_drop: [ALL]
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9788/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
          pids: 32
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  redis-exporter:
    profiles: [metrics]
    # Built from source like every other component. The published upstream image
    # is compiled with an older Go toolchain and carried two fixable HIGH
    # standard-library advisories with no patched tag available; see
    # docker/Dockerfile.redis-exporter.
    build:
      context: ./docker
      dockerfile: Dockerfile.redis-exporter
    image: ${REDIS_EXPORTER_IMAGE:-freesdn-redis-exporter:local}
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  postgres-exporter:
    profiles: [metrics]
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres-exporter
    image: ${POSTGRES_EXPORTER_IMAGE:-freesdn-postgres-exporter:local}
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-freesdn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-freesdn}?sslmode=disable"
    # PostgreSQL 17/18 split checkpoint counters out of pg_stat_bgwriter into
    # pg_stat_checkpointer; the pinned exporter's built-in stat_bgwriter collector
    # queries the removed column and errors every scrape on PG18. Disable just
    # that collector (the rest stay) until PG_EXPORTER_VERSION is bumped to a
    # PG18-aware release.
    command: ["--no-collector.stat_bgwriter"]
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

  logdb-exporter:
    profiles: [metrics]
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres-exporter
    image: ${POSTGRES_EXPORTER_IMAGE:-freesdn-postgres-exporter:local}
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${LOGDB_USER:-freesdn}:${LOGDB_PASSWORD}@logdb:5432/${LOGDB_DB:-freesdn_logs}?sslmode=disable"
    # See postgres-exporter: PG18 removed pg_stat_bgwriter.checkpoints_* - skip
    # the collector that errors every scrape.
    command: ["--no-collector.stat_bgwriter"]
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    networks: [default]

networks:
  # The project default network. Making it the *default* lets `api`, `worker` and
  # `worker-io` join it with NO `networks:` key — which is what allows the optional
  # VPN overlay (docker-compose.vpn.yml) to add `network_mode: service:vpn` to those
  # three without the illegal networks+network_mode combination (compose rejects a
  # service declaring both, and an override file cannot delete a base key). Those
  # three are exactly the processes that talk to remote sites: the api and the two
  # Celery workers that consume the queues carrying VPN and adapter work. All
  # other services attach explicitly via `networks: [default]`. Left
  # project-scoped (compose names it <project>_default) so multiple FreeSDN
  # stacks on one host don't collide on a shared network name.
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}
          ip_range: ${NETWORK_IP_RANGE:-${NETWORK_SUBNET:-172.28.0.0/16}}

volumes:
  hls_media:           # derived camera media/control; local-host scope, not backup data
  postgres_data:
  logdb_data:
  redis_data:
  celerybeat_data:
  evidence_data:
  fabric_artifacts:
  agent_releases:
  proxmox_uploads:
  firmware_data:
  plugin_data:
  backup_data:          # LocalStorageBackend default destination (/data/backups)
  sla_reports:          # rendered SLA CSV/PDF (SLA_REPORTS_DIR)
  voip_provisioning:    # generated handset config XML
  import_export_data:   # shared /tmp/freesdn_data - api writes, worker reads (and back)
  tailscale_state:
  tailscale_run:      # tailscaled control socket, shared vpn <-> api/worker
  netbird_state:      # netbird daemon state
  netbird_config:     # netbird config
  openvpn_config:     # .ovpn client configs the api writes, the sidecar runs
  vpn_run:            # openvpn pidfiles + desired/status markers (shared)
  wireguard_config:   # wg-quick INI configs the api writes, the sidecar brings up
  wireguard_run:      # wireguard desired/status markers (shared vpn <-> api)
  pg_backups:
  pg_backup_offsite_status:
  go2rtc_config:
  caddy_data:
  caddy_config:
  prometheus_data:
