# =============================================================================
# FreeSDN HA Overlay  (max/enterprise)
# =============================================================================
# Adds the high-availability topology on top of the base docker-compose.yml:
#   - Postgres primary + streaming standby (promotion still MANUAL - Patroni is
#     a separate roadmap item)
#   - Valkey master + replica + 3 Sentinels (AUTOMATIC failover) - and the
#     backend services are wired to consume Sentinel, so the app/Celery/WS
#     actually FOLLOW a Valkey master failover (not just observe it)
#   - 2 API replicas behind an nginx round-robin LB (cross-instance WS pubsub)
#
# Scope: single-host process failover, not protection against host loss.
# Asynchronous Valkey replication is not partition fencing or zero-RPO.
# Existing installations MUST read docker/redis/HA-UPGRADING before upgrading.
#
# Usage (with the max tier env):
#   docker compose --env-file .env.max -f docker-compose.yml -f docker-compose.ha.yml up -d
#
# Isolated fault qualification: scripts/check_valkey_ha.py --help.
# RTO/RPO for the Postgres path: scripts/ha_drill.py.

# Wire every backend service to Sentinel (merged into each service's base env).
x-sentinel-env: &sentinel-env
  REDIS_SENTINELS: "${HA_SENTINEL_1_IP:-172.30.255.21}:26379,${HA_SENTINEL_2_IP:-172.30.255.22}:26379,${HA_SENTINEL_3_IP:-172.30.255.23}:26379"
  REDIS_MASTER_NAME: "freesdn-master"
  CELERY_BROKER_URL: "sentinel://:${REDIS_PASSWORD}@${HA_SENTINEL_1_IP:-172.30.255.21}:26379/1;sentinel://:${REDIS_PASSWORD}@${HA_SENTINEL_2_IP:-172.30.255.22}:26379/1;sentinel://:${REDIS_PASSWORD}@${HA_SENTINEL_3_IP:-172.30.255.23}:26379/1"
  CELERY_RESULT_BACKEND: "sentinel://:${REDIS_PASSWORD}@${HA_SENTINEL_1_IP:-172.30.255.21}:26379/2;sentinel://:${REDIS_PASSWORD}@${HA_SENTINEL_2_IP:-172.30.255.22}:26379/2;sentinel://:${REDIS_PASSWORD}@${HA_SENTINEL_3_IP:-172.30.255.23}:26379/2"

# HA data-tier nodes are BUILT from the same OS-patching wrappers the base
# stack uses (docker/Dockerfile.{postgres,valkey}), so the standby and the
# replica ship the same current OS patches as the primary. Anchors are per-file,
# so these mirror the base compose's definitions.
x-postgres-build: &postgres-build
  context: ./docker
  dockerfile: Dockerfile.postgres
  args:
    # Must stay a trixie tag; see docker-compose.yml.
    POSTGRES_VERSION: ${POSTGRES_VERSION:-18.6-trixie}
x-valkey-build: &valkey-build
  context: ./docker
  dockerfile: Dockerfile.valkey
  args:
    VALKEY_VERSION: ${VALKEY_VERSION:-9.1.2-alpine}

services:
  # The public edge must use both replicas, not the base stack's single API.
  edge:
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-ha-lb:80}
    depends_on:
      ha-lb:
        condition: service_healthy

  # ── The PRIMARY needs a replication role before a standby can stream ───────
  # Only the HA overlay runs a standby, so only the HA overlay creates this.
  # Without it `postgres-standby` fails every pg_basebackup with "no pg_hba.conf
  # entry for replication connection ... user \"repl\"" and restart-loops
  # forever: nothing in the base compose or scripts/init-db.sql ever created the
  # role, and the official image's generated pg_hba covers `all` databases but
  # not the `replication` pseudo-database.
  #
  # Runs only on a FRESH postgres volume, like every /docker-entrypoint-initdb.d
  # script. Enabling --ha over an existing install needs the manual invocation in
  # the script's header.
  postgres:
    environment:
      REPL_USER: ${POSTGRES_REPL_USER:-repl}
      REPL_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    volumes:
      - ./docker/postgres/init-replication.sh:/docker-entrypoint-initdb.d/20-init-replication.sh:ro

  # ── Backend services consume Sentinel in HA (env merges with the base) ──────
  api:
    environment: *sentinel-env
  worker:
    environment: *sentinel-env
  worker-io:
    environment: *sentinel-env
  scheduler:
    environment: *sentinel-env
  flower:
    environment: *sentinel-env
  # collector was missing here. It runs the same backend image and gets its
  # client from app/core/redis_client.py, whose sentinel_addrs() reads
  # REDIS_SENTINELS and - finding it empty - falls back to a DIRECT connection
  # to the `redis` service name. After Sentinel promotes redis-replica, `redis`
  # is a read-only replica, so the collector's rate-limit INCR and its event
  # publishes fail with READONLY and never recover, while every other service
  # follows the new master. Nothing reports it: the receivers keep accepting
  # datagrams and the heartbeat file keeps being touched, so the container stays
  # healthy and SNMP-trap/syslog/NetFlow ingest simply stops reaching the bus.
  # (The `vpn` sidecar is deliberately NOT here - it execs
  # vpn-sidecar-entrypoint.sh and never opens a Redis client.)
  collector:
    environment: *sentinel-env

  # Stable, reserved addresses avoid blocking DNS lookups when a node stops.
  # Use .env.max; custom NETWORK_SUBNET requires all five HA_*_IP values and
  # NETWORK_IP_RANGE to be changed together. See docker/redis/HA-UPGRADING.
  redis:
    environment:
      HA_NODE_IP: ${HA_PRIMARY_IP:-172.30.255.10}
      HA_PRIMARY_IP: ${HA_PRIMARY_IP:-172.30.255.10}
    command: ["sh", "/usr/local/bin/freesdn-ha-entrypoint.sh", "primary"]
    volumes:
      - type: bind
        source: ./docker/redis/ha-entrypoint.sh
        target: /usr/local/bin/freesdn-ha-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        ipv4_address: ${HA_PRIMARY_IP:-172.30.255.10}

  redis-replica:
    build: *valkey-build
    restart: unless-stopped
    memswap_limit: ${REDIS_MEM_LIMIT:-768M}
    stop_grace_period: 30s
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HA_NODE_IP: ${HA_REPLICA_IP:-172.30.255.11}
      HA_PRIMARY_IP: ${HA_PRIMARY_IP:-172.30.255.10}
    command: ["sh", "/usr/local/bin/freesdn-ha-entrypoint.sh", "replica"]
    volumes:
      - redis_replica_data:/data
      - type: bind
        source: ${REDIS_CONFIG_PATH:-./docker/redis/redis-custom.conf}
        target: /usr/local/etc/valkey/valkey-custom.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/redis/ha-entrypoint.sh
        target: /usr/local/bin/freesdn-ha-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-768M}
          cpus: '${REDIS_CPU_LIMIT:-1.0}'
    security_opt: [no-new-privileges:true]
    networks:
      default:
        ipv4_address: ${HA_REPLICA_IP:-172.30.255.11}

  # ── PostgreSQL standby (streaming replica of the primary) ───────────────────
  postgres-standby:
    build: *postgres-build
    image: ${POSTGRES_IMAGE:-freesdn-postgres:local}
    container_name: freesdn-postgres-standby
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freesdn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-freesdn}
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      REPL_USER: ${POSTGRES_REPL_USER:-repl}
      REPL_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    volumes:
      - postgres_standby_data:/var/lib/postgresql
      - ./docker/postgres/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    entrypoint: ["/standby-entrypoint.sh"]
    ports:
      - "127.0.0.1:${POSTGRES_STANDBY_HOST_PORT:-15434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [default]

  # Persist Sentinel configuration, including epochs and elected master.
  # No dependency on the bootstrap primary: a promoted replica must be able
  # to restart while that original node is still down.
  redis-sentinel-1: &sentinel
    build: *valkey-build
    restart: unless-stopped
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HA_NODE_IP: ${HA_SENTINEL_1_IP:-172.30.255.21}
      HA_PRIMARY_IP: ${HA_PRIMARY_IP:-172.30.255.10}
    command: ["sh", "/usr/local/bin/freesdn-ha-entrypoint.sh", "sentinel"]
    volumes:
      - redis_sentinel_1_data:/data
      - type: bind
        source: ./docker/redis/ha-entrypoint.sh
        target: /usr/local/bin/freesdn-ha-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD valkey-cli -p 26379 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    security_opt: [no-new-privileges:true]
    networks:
      default:
        ipv4_address: ${HA_SENTINEL_1_IP:-172.30.255.21}

  redis-sentinel-2:
    <<: *sentinel
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HA_NODE_IP: ${HA_SENTINEL_2_IP:-172.30.255.22}
      HA_PRIMARY_IP: ${HA_PRIMARY_IP:-172.30.255.10}
    volumes:
      - redis_sentinel_2_data:/data
      - type: bind
        source: ./docker/redis/ha-entrypoint.sh
        target: /usr/local/bin/freesdn-ha-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        ipv4_address: ${HA_SENTINEL_2_IP:-172.30.255.22}

  redis-sentinel-3:
    <<: *sentinel
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HA_NODE_IP: ${HA_SENTINEL_3_IP:-172.30.255.23}
      HA_PRIMARY_IP: ${HA_PRIMARY_IP:-172.30.255.10}
    volumes:
      - redis_sentinel_3_data:/data
      - type: bind
        source: ./docker/redis/ha-entrypoint.sh
        target: /usr/local/bin/freesdn-ha-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        ipv4_address: ${HA_SENTINEL_3_IP:-172.30.255.23}

  # ── Second API replica - proves cross-instance WS pubsub ────────────────────
  api-2:
    extends:
      file: docker-compose.yml
      service: api
    container_name: freesdn-api-2
    environment: *sentinel-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_2_HOST_PORT:-18001}:8000"

  # ── nginx round-robin LB across the two API replicas ────────────────────────
  ha-lb:
    build:
      context: ./docker
      dockerfile: Dockerfile.ha-lb
      args:
        NGINX_VERSION: ${HA_NGINX_VERSION:-1.30.5-alpine}
    image: ${HA_LB_IMAGE:-freesdn-ha-lb:local}
    container_name: freesdn-ha-lb
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    volumes:
      - ./docker/ha-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${HA_LB_HOST_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default]

volumes:
  postgres_standby_data:
  redis_replica_data:
  redis_sentinel_1_data:
  redis_sentinel_2_data:
  redis_sentinel_3_data:
