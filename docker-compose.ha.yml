# =============================================================================
# FreeSDN HA Overlay  (max/enterprise)
# =============================================================================
# Adds the high-availability topology on top of the base docker-compose.yml:
#   - Postgres primary + streaming standby (promotion still MANUAL - Patroni is
#     a separate roadmap item)
#   - Valkey master + replica + 3 Sentinels (AUTOMATIC failover) - and the
#     backend services are wired to consume Sentinel, so the app/Celery/WS
#     actually FOLLOW a Valkey master failover (not just observe it)
#   - 2 API replicas behind an nginx round-robin LB (cross-instance WS pubsub)
#
# Usage (with the max tier env):
#   docker compose --env-file .env.max -f docker-compose.yml -f docker-compose.ha.yml up -d
#
# Failover drill: scripts/redis_failover_drill.sh (kill master → assert promote
# + app follows). RTO/RPO for the Postgres path: scripts/ha_drill.py.

# Wire every backend service to Sentinel (merged into each service's base env).
x-sentinel-env: &sentinel-env
  REDIS_SENTINELS: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379"
  REDIS_MASTER_NAME: "freesdn-master"
  CELERY_BROKER_URL: "sentinel://:${REDIS_PASSWORD}@redis-sentinel-1:26379;sentinel://:${REDIS_PASSWORD}@redis-sentinel-2:26379;sentinel://:${REDIS_PASSWORD}@redis-sentinel-3:26379/1"
  CELERY_RESULT_BACKEND: "sentinel://:${REDIS_PASSWORD}@redis-sentinel-1:26379;sentinel://:${REDIS_PASSWORD}@redis-sentinel-2:26379;sentinel://:${REDIS_PASSWORD}@redis-sentinel-3:26379/2"

# HA data-tier nodes are BUILT from the same apt-get-upgrade wrappers the base
# stack uses (docker/Dockerfile.{postgres,valkey}), so the standby and the
# replica ship the same current OS patches as the primary. Anchors are per-file,
# so these mirror the base compose's definitions.
x-postgres-build: &postgres-build
  context: ./docker
  dockerfile: Dockerfile.postgres
  args:
    POSTGRES_VERSION: ${POSTGRES_VERSION:-18.6-trixie}
x-valkey-build: &valkey-build
  context: ./docker
  dockerfile: Dockerfile.valkey
  args:
    VALKEY_VERSION: ${VALKEY_VERSION:-8.1.9-trixie}

services:
  # ── The PRIMARY needs a replication role before a standby can stream ───────
  # Only the HA overlay runs a standby, so only the HA overlay creates this.
  # Without it `postgres-standby` fails every pg_basebackup with "no pg_hba.conf
  # entry for replication connection ... user \"repl\"" and restart-loops
  # forever: nothing in the base compose or scripts/init-db.sql ever created the
  # role, and the official image's generated pg_hba covers `all` databases but
  # not the `replication` pseudo-database.
  #
  # Runs only on a FRESH postgres volume, like every /docker-entrypoint-initdb.d
  # script. Enabling --ha over an existing install needs the manual invocation in
  # the script's header.
  postgres:
    environment:
      REPL_USER: ${POSTGRES_REPL_USER:-repl}
      REPL_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    volumes:
      - ./docker/postgres/init-replication.sh:/docker-entrypoint-initdb.d/20-init-replication.sh:ro

  # ── Backend services consume Sentinel in HA (env merges with the base) ──────
  api:
    environment: *sentinel-env
  worker:
    environment: *sentinel-env
  worker-io:
    environment: *sentinel-env
  scheduler:
    environment: *sentinel-env
  flower:
    environment: *sentinel-env
  # collector was missing here. It runs the same backend image and gets its
  # client from app/core/redis_client.py, whose sentinel_addrs() reads
  # REDIS_SENTINELS and - finding it empty - falls back to a DIRECT connection
  # to the `redis` service name. After Sentinel promotes redis-replica, `redis`
  # is a read-only replica, so the collector's rate-limit INCR and its event
  # publishes fail with READONLY and never recover, while every other service
  # follows the new master. Nothing reports it: the receivers keep accepting
  # datagrams and the heartbeat file keeps being touched, so the container stays
  # healthy and SNMP-trap/syslog/NetFlow ingest simply stops reaching the bus.
  # (The `vpn` sidecar is deliberately NOT here - it execs
  # vpn-sidecar-entrypoint.sh and never opens a Redis client.)
  collector:
    environment: *sentinel-env

  # ── Valkey replica - Sentinel's promotion target ───────────────────────────
  # Replicates the base `redis` master. On a master failure Sentinel promotes
  # this node; the app (master_for) re-resolves and follows it.
  redis-replica:
    build: *valkey-build
    container_name: freesdn-redis-replica
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    # The healthcheck below expands $$REDIS_PASSWORD INSIDE the container, so the
    # variable has to exist there. It did not, so valkey-cli authenticated with an
    # empty password and the replica sat permanently `unhealthy` --
    # "AUTH failed: WRONGPASS" -- while replicating perfectly happily. The primary
    # `redis` service has carried this same block all along
    # (docker-compose.yml:203); only the replica was missing it.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >-
      valkey-server
      --replicaof redis 6379
      --masterauth ${REDIS_PASSWORD}
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory-policy volatile-lru
      --replica-announce-ip redis-replica
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: [no-new-privileges:true]
    networks: [default]

  # ── PostgreSQL standby (streaming replica of the primary) ───────────────────
  postgres-standby:
    build: *postgres-build
    container_name: freesdn-postgres-standby
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freesdn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-freesdn}
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      REPL_USER: ${POSTGRES_REPL_USER:-repl}
      REPL_PASSWORD: ${POSTGRES_REPL_PASSWORD}
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - ./docker/postgres/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    entrypoint: ["/standby-entrypoint.sh"]
    ports:
      - "127.0.0.1:${POSTGRES_STANDBY_HOST_PORT:-15434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [default]

  # ── Valkey Sentinels - 3-node quorum, AUTH + hostname-aware (Docker) ────────
  # The config is built with printf (NOT a heredoc): a heredoc inside a YAML
  # folded `>-` scalar collapses to one line and breaks. resolve/announce-
  # hostnames make Sentinel address master+replica by their Docker service
  # names rather than ephemeral IPs. requirepass lets the app's Sentinel client
  # AUTH to the sentinels.
  redis-sentinel-1: &sentinel
    build: *valkey-build
    container_name: freesdn-redis-sentinel-1
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >-
      sh -c "printf '%s\n'
      'port 26379'
      'sentinel resolve-hostnames yes'
      'sentinel announce-hostnames yes'
      'sentinel monitor freesdn-master redis 6379 2'
      'sentinel auth-pass freesdn-master ${REDIS_PASSWORD}'
      'requirepass ${REDIS_PASSWORD}'
      'sentinel down-after-milliseconds freesdn-master 5000'
      'sentinel failover-timeout freesdn-master 10000'
      'sentinel parallel-syncs freesdn-master 1'
      > /tmp/sentinel.conf && exec valkey-sentinel /tmp/sentinel.conf"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 26379 -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: [no-new-privileges:true]
    networks: [default]

  redis-sentinel-2:
    <<: *sentinel
    container_name: freesdn-redis-sentinel-2

  redis-sentinel-3:
    <<: *sentinel
    container_name: freesdn-redis-sentinel-3

  # ── Second API replica - proves cross-instance WS pubsub ────────────────────
  api-2:
    extends:
      file: docker-compose.yml
      service: api
    container_name: freesdn-api-2
    environment: *sentinel-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_2_HOST_PORT:-18001}:8000"

  # ── nginx round-robin LB across the two API replicas ────────────────────────
  ha-lb:
    image: nginx:1.31.4-alpine
    container_name: freesdn-ha-lb
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    volumes:
      - ./docker/ha-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${HA_LB_HOST_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default]

volumes:
  postgres_standby_data:
