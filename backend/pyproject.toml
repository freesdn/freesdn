[tool.poetry]
name = "freesdn-backend"
version = "26.08.1"
description = "FreeSDN - Unified Network Management Platform"
license = "AGPL-3.0-only"
authors = ["PyPV - Python Platform Ventures <contact@freesdn.org>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
# Web Framework
# starlette 1.x: the old <0.137 hold is LIFTED. fastapi 0.138.1 declares
# starlette>=0.46 with no upper bound, and prometheus-fastapi-instrumentator 8.x
# now handles fastapi's _IncludedRouter route type (the .path crash 7.x hit). The
# three move together (instrumentator 8.x REQUIRES starlette 1.x) and pull
# starlette 1.3.1, which fixes CVE-2026-48818 / CVE-2026-54283.
fastapi = ">=0.138.1,<0.139"
uvicorn = {extras = ["standard"], version = ">=0.46.0"}
gunicorn = ">=26.0.0"
# Database
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.49"}
asyncpg = ">=0.31.0"
psycopg = {extras = ["binary"], version = ">=3.3.4"}
alembic = ">=1.18.4"
# Redis client library (redis-py) — NOT a Redis server. The broker + cache are
# Valkey (see the valkey/valkey image), which speaks the Redis wire protocol, so
# redis-py is the standard client and works fully against Valkey 8.x.
# The <6.5 ceiling is imposed by Celery's kombu transport, not by us: the LATEST
# kombu (5.6.2, re-verified against PyPI 2026-07-01) still requires redis
# >=4.5.2,<6.5. So redis-py 6.4.0 is the newest client the current Celery stack
# allows. Moving to redis-py 8 / valkey-py would require replacing Celery with an
# async-native queue (arq / taskiq) — a post-launch project, not a version bump.
redis = {extras = ["hiredis"], version = ">=6.4.0,<6.5"}
# Task Queue
celery = {extras = ["redis"], version = ">=5.6.3"}
flower = ">=2.0.1"
# Validation & Serialization
pydantic = ">=2.13.4"
pydantic-settings = ">=2.14.1"
email-validator = ">=2.3.0"
# Authentication
# PyJWT 2.13.0: algorithm allow-list and HMAC/JWK key-family fixes
# (GHSA-jq35-7prp-9v3f, GHSA-xgmm-8j9v-c9wx). FreeSDN self-issues HS256 with a
# symmetric secret and does not use PyJWKClient, but pin the patched line anyway.
PyJWT = {extras = ["crypto"], version = ">=2.13.0"}
# Password hashing: argon2-cffi directly. We previously used passlib's
# argon2 wrapper, but passlib went unmaintained in Oct 2020. The output
# hash format is identical (PHC ``$argon2id$v=19$m=65536,t=3,p=4$...``)
# so existing user hashes verify under both libraries - migrated
# 2026-05-25 in app/core/security.py.
argon2-cffi = ">=23.1.0"
pyotp = ">=2.9.0"
# SECURITY: cryptography 49.x is the current supported line (latest); 48.0.1+
# rebuilt the wheels against a patched OpenSSL (GHSA-537c-gmf6-5ccf). The full
# test suite (Fernet encrypt/decrypt round-trips) gates the major bump.
cryptography = ">=49.0.0"
# HTTP Client
httpx = ">=0.28.1"
# aiohttp 3.14.1: parser/limit and connection-reuse hardening batch
# (GHSA-4m7w-qmgq-4wj5 TLS hostname reuse, GHSA-63hw-fmq6-xxg2 max_line_size,
# plus 6 related low/medium fixes). Ships cp314 wheels.
aiohttp = ">=3.14.1"
# Utilities
# python-multipart 0.0.31: querystring-parsing DoS + Content-Disposition/2231
# parameter-smuggling fixes (GHSA-5rvq-cxj2-64vf, GHSA-vffw-93wf-4j4q, GHSA-v9pg-7xvm-68hf).
python-multipart = ">=0.0.31"
python-dateutil = ">=2.9.0"
orjson = ">=3.11.9"
jinja2 = ">=3.1.6"
pillow = ">=12.2.0"
qrcode = ">=8.2"
# Internationalization (i18n)
babel = ">=2.18.0"
# ONVIF camera protocol support
onvif-zeep = ">=0.2.12"
defusedxml = ">=0.7.1"
# WebPush (browser push notifications for camera alerts). Optional at runtime:
# push is disabled gracefully if the package or VAPID keys are absent.
pywebpush = ">=2.0.0"
# Security pins for transitive dependencies (CVE fixes)
# tornado: pulled by celery/flower. 6.5.7 fixes cross-origin credential leaks
# (GHSA-3x9g-8vmp-wqvf, GHSA-pw6j-qg29-8w7f) + a gzip-bomb DoS (GHSA-mgf9-4vpg-hj56).
tornado = ">=6.5.7"
# pygments: pulled by various, CVE-2026-4539
pygments = ">=2.20.0"
# requests: pulled by various, CVE-2026-25645 (fixed in 2.34.1).
# 2.34.2 (2026-05-14) cleared the 3-day supply-chain hold on 2026-05-17 - now allowed.
requests = ">=2.34.2"
# urllib3: CVE-2026-44431 (cross-origin redirect leak), CVE-2026-44432 (decompression DoS), fix in 2.7.0
urllib3 = ">=2.7.0"
# lxml: pulled by onvif-zeep / defusedxml, CVE-2026-41066
lxml = ">=6.1.0"
# python-dotenv: pulled by pydantic-settings, CVE-2026-28684
python-dotenv = ">=1.2.2"
# mako: pulled by alembic, CVE-2026-44307
mako = ">=1.3.12"
# Metrics (Prometheus exposition for /metrics endpoint)
prometheus-client = ">=0.25.0"
# 8.x REQUIRES starlette>=1.0 (the unblocker for the starlette-1.x CVE fix) and
# handles fastapi's _IncludedRouter route type that the 7.x line crashed on.
prometheus-fastapi-instrumentator = ">=8.0.2,<9"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=1.3.0"
pytest-cov = ">=7.1.0"
httpx = ">=0.28.1"
ruff = ">=0.15.12"
mypy = ">=2.1.0"
pre-commit = ">=4.6.0"
factory-boy = ">=3.3.3"
# faker: the 3-day supply-chain hold on 40.16.0 (released mid-May 2026) has long
# since cleared; tracking the latest line (test-data generation, dev-only).
faker = ">=40.23.0"
pip-audit = ">=2.10.0"
bandit = ">=1.9.4"
# Integration test infrastructure - real Postgres + Redis via Docker
# NOTE: testcontainers 4.14+ requires redis>=7, but our redis is capped <6.5 by kombu.
# Held at 4.13.3 until kombu lifts its redis cap.
testcontainers = {extras = ["postgres", "redis"], version = ">=4.13.3,<4.14"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused first argument (interface/adapter methods, FastAPI deps)
    "ARG002", # unused method argument (interface contracts)
    "ARG003", # unused class method argument
    "ARG004", # unused static method argument
    "E402",   # module-level import not at top (intentional lazy imports)
    "E741",   # ambiguous variable name (common in networking code)
    "SIM102", # collapsible if statements (style preference)
    "SIM103", # needless bool return (style preference)
    "SIM105", # suppressible exception (style preference)
    "SIM115", # open-file-with-context-handler (style preference)
    "SIM117", # multiple-with-statements (style preference)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: real-infrastructure tests that spin up Postgres + Redis via testcontainers (require Docker)",
]
