<?xml version="1.0" encoding="UTF-8"?>
<!--
  FreeSDN maskable PWA icon (512×512).

  Maskable-safe: the brand colour fills the ENTIRE canvas (the platform mask
  supplies the rounded/circular crop), and the network glyph sits well within
  the inner 80% safe zone so no part is clipped on Android adaptive icons.
  Declared in manifest.webmanifest with purpose "any maskable".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FreeSDN">
  <rect width="512" height="512" fill="#1E63E8"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round">
    <rect x="216" y="120" width="80" height="66" rx="16" />
    <rect x="120" y="330" width="80" height="66" rx="16" />
    <rect x="312" y="330" width="80" height="66" rx="16" />
    <line x1="256" y1="186" x2="160" y2="330" />
    <line x1="256" y1="186" x2="352" y2="330" />
  </g>
</svg>
