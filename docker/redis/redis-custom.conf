# ============================================================
# FreeSDN - Redis Custom Configuration
# ============================================================
# This file is mounted into the Redis container.
# Uncomment and adjust settings to tune for YOUR hardware.
# Redis defaults work well for most deployments.
#
# This is the default Pro/Max configuration. Lite selects redis-lite.conf via
# REDIS_CONFIG_PATH. Existing custom files are never overridden by a CLI limit.
# maxmemory excludes some buffers and is not a container/RSS limit. Persistence
# copy-on-write and fragmentation need additional headroom; pressure-test your
# workload with scripts/check_valkey_memory.py before changing the budget.
# ============================================================

# ── Memory ──────────────────────────────────────────────────
# Pro container limit is 768 MiB; Max is 1 GiB. Keep room for fork copy-on-write.
# The previous 512 MiB budget can OOM during Pro persistence without swap.
# This remains a starting budget, not a workload capacity guarantee.
maxmemory 256mb

# ── Networking ──────────────────────────────────────────────
# tcp-backlog 511
# timeout 300
# tcp-keepalive 60

# ── Persistence (AOF is enabled via --appendonly in compose) ─
# RDB snapshots as secondary backup.
# save 3600 1
# save 300 100
# save 60 10000
