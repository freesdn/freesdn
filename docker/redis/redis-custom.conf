# ============================================================
# FreeSDN - Redis Custom Configuration
# ============================================================
# This file is mounted into the Redis container.
# Uncomment and adjust settings to tune for YOUR hardware.
# Redis defaults work well for most deployments.
#
# Quick sizing guide:
#   Set maxmemory to ~60-70% of the container memory limit.
#   Default container limit is 768MB → maxmemory 512mb is safe.
# ============================================================

# ── Memory ──────────────────────────────────────────────────
# Set maxmemory to ~60-70% of the container memory limit.
# Default container limit is 768MB → 512mb is safe.
maxmemory 512mb

# ── Networking ──────────────────────────────────────────────
# tcp-backlog 511
# timeout 300
# tcp-keepalive 60

# ── Persistence (AOF is enabled via --appendonly in compose) ─
# RDB snapshots as secondary backup.
# save 3600 1
# save 300 100
# save 60 10000
