# FreeSDN Lite: 64 MiB managed memory inside a 384 MiB container.
# The former 96 MiB budget reached the cgroup ceiling and was OOM-killed
# during automatic AOF rewrite under hosted pressure. So was this one, in
# the former 256 MiB container: most of the overhead does not shrink with
# the budget, so the container limit was raised instead.
# Reserve memory for allocator/client buffers and persistence copy-on-write.
# maxmemory is NOT an RSS/cgroup limit; qualify your workload before increasing.
# TTL cache keys can be evicted; a full non-TTL broker returns write errors.
# AOF and volatile-lru are enabled by Compose, as for the other tiers.
maxmemory 64mb
