# ============================================================
# FreeSDN - PostgreSQL Custom Configuration
# ============================================================
# This file is mounted into PostgreSQL's conf.d/ directory.
# Uncomment and adjust settings to tune for YOUR hardware.
# PostgreSQL's built-in defaults work well for most deployments.
#
# Quick sizing guide (set shared_buffers to ~25% of total RAM):
#   4GB  RAM → shared_buffers = 1GB,   effective_cache_size = 3GB
#   8GB  RAM → shared_buffers = 2GB,   effective_cache_size = 6GB
#   16GB RAM → shared_buffers = 4GB,   effective_cache_size = 12GB
#   32GB RAM → shared_buffers = 8GB,   effective_cache_size = 24GB
#
# Use https://pgtune.leopard.in.ua/ for automated recommendations.
# ============================================================

# ── Memory ──────────────────────────────────────────────────
# shared_buffers = 256MB
# effective_cache_size = 768MB
# work_mem = 8MB
# maintenance_work_mem = 128MB

# ── Connections ─────────────────────────────────────────────
# max_connections = 200

# ── WAL & Checkpoints ──────────────────────────────────────
# wal_buffers = 16MB
# checkpoint_completion_target = 0.9

# ── Query Planner ───────────────────────────────────────────
# random_page_cost = 1.1         # SSD: 1.1, HDD: 4.0

# ── Logging ─────────────────────────────────────────────────
# log_min_duration_statement = 1000   # Log queries slower than 1s
