# ============================================================
# FreeSDN - TimescaleDB (LogDB) Custom Configuration
# ============================================================
# This file is mounted into the logdb container's conf.d/ directory.
# Uncomment and adjust settings to tune for YOUR hardware.
# Validate resource settings against your workload before production use.
# ============================================================

# TimescaleDB reserves up to 16 background workers, and PostgreSQL permits
# up to 8 parallel query workers. Its upstream pool of 8 cannot accommodate
# both: scheduled compression, retention and aggregate refresh jobs fail to
# start. Keep headroom for the extension launcher and PostgreSQL workers.
# This is a process-slot limit, not 32 permanently running query workers.
# A logdb restart is required after changing this setting.
max_worker_processes = 32

# ── Memory ──────────────────────────────────────────────────
# shared_buffers = 256MB
# effective_cache_size = 768MB
# work_mem = 8MB

# ── Connections ─────────────────────────────────────────────
# max_connections = 100
