; =============================================================================
; PgBouncer - Connection pooler for LogDB (TimescaleDB)
; =============================================================================
; Same pooling strategy as primary, but tuned for write-heavy time-series.
; LogDB sees mostly INSERT workloads from metrics/health check tasks.

[databases]
freesdn_logs = host=logdb port=5432 dbname=freesdn_logs

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Authentication ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Pool mode ---
pool_mode = transaction

; --- Pool sizing ---
; Smaller than primary - LogDB has fewer concurrent readers.
default_pool_size = 15
min_pool_size = 3
reserve_pool_size = 3
reserve_pool_timeout = 3

max_client_conn = 100

; --- Timeouts ---
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 300
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

; --- Logging ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; --- Admin ---
admin_users = freesdn
stats_users = freesdn
