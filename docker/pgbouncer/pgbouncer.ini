; =============================================================================
; PgBouncer - Connection pooler for Primary PostgreSQL
; =============================================================================
; FreeSDN routes all primary-DB connections through PgBouncer so that
; multiple API workers + Celery processes share a bounded connection pool
; instead of each opening their own.
;
; Tuning guide:
;   default_pool_size × number of databases ≤ PostgreSQL max_connections
;   For a 4-worker API + 1 Celery worker:  default_pool_size=25 is fine.
;   Increase if you scale to many replicas.

[databases]
; Route the freesdn database to the upstream postgres container.
; The actual DB name, host, and port are injected via environment at
; container start.  Defaults here match docker-compose service names.
freesdn = host=postgres port=5432 dbname=freesdn

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Authentication ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Pool mode ---
; transaction: release connection back to pool after each transaction.
; Best for SQLAlchemy + asyncpg which uses autocommit between requests.
pool_mode = transaction

; --- Pool sizing ---
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Maximum client connections PgBouncer will accept
max_client_conn = 200

; --- Timeouts ---
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 300
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

; --- Logging ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; --- Admin ---
admin_users = freesdn
stats_users = freesdn

; --- TLS (disabled inside Docker network) ---
; server_tls_sslmode = disable
; client_tls_sslmode = disable
