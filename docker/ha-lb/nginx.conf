# nginx loadbalancer for the HA drill stack.
#
# Round-robins between api and api-2. Treats /health as a cheap upstream
# probe so the LB's own /health endpoint can shortcut to a 200 without
# round-tripping a backend.
#
# This is drill infrastructure, not a finished prod LB:
#   - No TLS termination (the upstream stack handles that)
#   - No request body limits beyond nginx defaults
#   - No WAF, no rate limiting beyond the API's own middleware
#
# For real prod HA put a Traefik + cert-manager / nginx-ingress / cloud LB
# in front instead.

worker_processes 1;
events { worker_connections 256; }

http {
    upstream api_pool {
        server api:8000   max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
        # Sticky behavior off on purpose - the drill needs to prove that
        # subsequent requests CAN land on the surviving pod after a kill.
    }

    # Treat WebSocket upgrade headers correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Cheap probe - answer here so the LB looks healthy even mid-failover.
        # Drill checks API health via /api/v1/health/ready, not this.
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Everything else fans out to the pool.
        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
