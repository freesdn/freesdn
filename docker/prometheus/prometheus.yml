# FreeSDN - Prometheus scrape config (the `metrics` compose profile).
# Scrapes the API's /metrics (app + business + queue metrics), plus the Valkey
# and Postgres/LogDB exporters, and loads the shipped alert rules.
#
# The api serves /metrics in production only to a bearer token. The installer
# generates METRICS_AUTH_TOKEN; the compose entrypoint writes it to
# /tmp/metrics_auth_token inside this container, which the freesdn-api job
# reads below. Never paste the token into this file.
# Wire alerts to Alertmanager by adding an `alerting:` block + an alertmanager
# service; the rules already carry severity + runbook_url annotations.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: freesdn

rule_files:
  - /etc/prometheus/freesdn-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI app metrics (prometheus-fastapi-instrumentator + app/core/metrics.py)
  - job_name: freesdn-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_auth_token
    static_configs:
      - targets: ["api:8000"]

  # Valkey/Redis infrastructure metrics
  - job_name: valkey
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Primary Postgres metrics
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # TimescaleDB (LogDB) metrics
  - job_name: logdb
    static_configs:
      - targets: ["logdb-exporter:9187"]

  # Dedicated status-only exporter; no backup files or credentials over HTTP.
  - job_name: freesdn-backups
    static_configs:
      - targets: ["backup-metrics:9788"]
