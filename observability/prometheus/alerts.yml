  # ──────────────────────────────────────────────────────────────────────
  - name: freesdn.database
    interval: 30s
    rules:

      - alert: FreeSDNPostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "FreeSDN Postgres is down"
          description: |
            The primary FreeSDN Postgres instance is not responding to
            ``pg_isready``. The API will fail-fast on every request.
          runbook_url: "https://docs.freesdn.org/reference/troubleshooting/"

      - alert: FreeSDNLogDBDown
        expr: pg_up{instance=~".*logdb.*"} == 0
        for: 5m
        labels:
          severity: warning
          component: logdb
        annotations:
          summary: "FreeSDN LogDB (TimescaleDB) is down"
          description: |
            LogDB powers metrics, health snapshots, and event history.
            Other features keep working but time-series writes are
            dropped until logdb is back.

  # ──────────────────────────────────────────────────────────────────────
  - name: freesdn.redis
    interval: 30s
    rules:

      - alert: FreeSDNRedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "FreeSDN Redis is down"
          description: |
            Redis is the backing store for sessions, the rate limiter,
            the token blacklist, the event bus, and Celery. With Redis
            down most of the API surface degrades or fails.
          runbook_url: "https://docs.freesdn.org/reference/troubleshooting/"

  # ──────────────────────────────────────────────────────────────────────
  - name: freesdn.security
    interval: 30s
    rules:

      - alert: FreeSDNAuditWriteFailing
        # A resource label is created on its first failure, so its first
        # scrape can already be 1: rate()/increase() would miss that loss.
        # A quiet counter does not mean the missing audit record was repaired.
        # This remains process-lifetime telemetry, not a durable incident ledger.
        expr: freesdn_audit_write_failures_total > 0
        for: 1m
        labels:
          severity: critical
          component: audit
          compliance: "true"
        annotations:
          summary: "Audit persistence failure observed"
          description: |
            One or more audit write attempts failed for resource_type=
            {{ $labels.resource_type }} during this counter's lifetime.
            A quiet counter does not prove the audit gap was repaired.
            Preserve the affected logs and investigate database health;
            do not replay a device command to recreate its audit entry.
            Counter reset or disappearance is not recovery confirmation.
            See observability/prometheus/audit-failures.md in the release sources.

      - alert: FreeSDNAuthLoginBruteForce
        expr: |
          sum(rate(freesdn_auth_events_total{event_type="login",status="failure"}[5m]))
            > 5
        for: 10m
        labels:
          severity: warning
          component: auth
        annotations:
          summary: "Login failure rate > 5/s for 10 minutes"
          description: |
            Sustained high login-failure rate suggests credential
            stuffing or brute-force attack. The per-IP rate limiter
            should be blocking these at 5/min - confirm the limiter is
            up and consider broader IP-block rules at the edge.

      # DISARMED 2026-08-27, same reason as the freesdn.celery group above:
      # ``freesdn_rate_limit_hits`` (backend/app/core/metrics.py:200) is
      # declared and never incremented. The two 429 paths that would do it are
      # app/core/middleware.py:582 and :593. Note that the obvious substitute
      # does NOT exist either: setup_metrics() builds the instrumentator with
      # should_group_status_codes=True (metrics.py:283), so http_requests_total
      # carries status="4xx" and cannot single out a 429.
      #
      # TO RE-ARM: uncomment together with a .labels(endpoint=...).inc() on
      # both 429 paths. That one is a genuine two-liner in the API process, no
      # new scrape target needed.
      #
      # - alert: FreeSDNRateLimitSpike
      #   expr: |
      #     sum(rate(freesdn_rate_limit_hits_total[5m])) > 50
      #   for: 10m
      #   labels:
      #     severity: warning
      #     component: api
      #   annotations:
      #     summary: "Rate-limit hits > 50/s for 10 minutes"
      #     description: |
      #       Lots of clients are getting 429s. Either there's a real
      #       attack, a buggy client retrying without backoff, or your
      #       rate-limit settings are too tight for current traffic.

  # ──────────────────────────────────────────────────────────────────────
  - name: freesdn.adapters
    interval: 30s
    rules:

      - alert: FreeSDNAdapterErrorRate
        expr: |
          sum by (adapter) (rate(freesdn_adapter_errors_total[5m]))
            > 1
        for: 10m
        labels:
          severity: warning
          component: adapter
        annotations:
          summary: "Adapter {{ $labels.adapter }} error rate > 1/s"
          description: |
            The {{ $labels.adapter }} adapter is failing > 1 call per
            second over a 10-minute window. Check adapter
            configuration (controller URL, credentials), check the
            target controller's own health, and if it's transient
            consider raising ``adapter_request_duration`` timeouts.

      - alert: FreeSDNAdapterLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (adapter, le) (rate(freesdn_adapter_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 15m
        labels:
          severity: info
          component: adapter
        annotations:
          summary: "Adapter {{ $labels.adapter }} p95 latency > 5s"
          description: |
            Slow vendor API calls. This is informational - most
            controllers are slow under load - but sustained latency
            here will surface as user-visible UI delays and queue
            backlogs.

  # ──────────────────────────────────────────────────────────────────────
  - name: freesdn.plugins
    interval: 30s
    rules:

      - alert: FreeSDNPluginOperationFailures
        expr: |
          sum(rate(freesdn_plugin_operations_total{status="failure"}[5m]))
            > 0.1
        for: 10m
        labels:
          severity: warning
          component: plugins
        annotations:
          summary: "Plugin operations failing"
          description: |
            Plugin install / enable / disable / uninstall operations are
            failing at > 0.1/s. Often indicates a plugin manifest
            mismatch, a sandbox violation, or a plugin's on_install
            hook crashing. Check the operation label to scope.


  # ──────────────────────────────────────────────────────────────────────
  - name: freesdn.backups
    interval: 60s
    rules:

      - alert: FreeSDNBackupMetricsUnavailable
        expr: up{job="freesdn-backups"} == 0 or absent(up{job="freesdn-backups"})
        for: 5m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "Backup metrics cannot be collected"
          description: "Check the backup-metrics container and Prometheus scrape target. Missing observations do not establish backup health."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNBackupStateInvalid
        expr: freesdn_pg_backup_status_valid == 0 or freesdn_pg_backup_config_valid == 0 or freesdn_pg_backup_pair_present == 0
        for: 5m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "Backup status or completed database pair is missing or invalid"
          description: "Check both database archives, the completion pointer, timing settings and pg-backup logs. This also fires before the first successful backup."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNBackupDisabled
        expr: freesdn_pg_backup_enabled == 0 and freesdn_pg_backup_status_valid == 1
        for: 5m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "Database backups are disabled"
          description: "Without a working encryption recipient/key the service fails closed. Configure GPG; plaintext requires an explicit development-only opt-in."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNBackupFailed
        expr: freesdn_pg_backup_last_attempt_failed == 1
        for: 5m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "The latest database backup attempt failed"
          description: "A previous success does not clear a newer failed attempt. Check pg-backup logs, database access, encryption and free space."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNBackupStale
        expr: time() - freesdn_pg_backup_last_success_timestamp > freesdn_pg_backup_max_age_seconds
        for: 15m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "The last completed database backup exceeds its configured age limit"
          description: "The threshold uses BACKUP_INTERVAL_SECONDS plus BACKUP_FRESHNESS_GRACE_SECONDS. Check pg-backup logs and complete a restore drill separately."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNBackupUnencrypted
        expr: freesdn_pg_backup_encryption_enabled == 0 and freesdn_pg_backup_enabled == 1
        for: 30m
        labels: {severity: warning, component: backup}
        annotations:
          summary: "Database backups are running without GPG encryption"
          description: "Plaintext was explicitly enabled. Configure BACKUP_GPG_RECIPIENT and BACKUP_GPG_PUBLIC_KEY_PATH for production."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNOffsiteBackupUnavailable
        expr: (freesdn_pg_backup_offsite_status_valid == 0 or freesdn_pg_backup_offsite_last_success_timestamp == 0) and freesdn_pg_backup_offsite_required == 1
        for: 5m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "Required off-site backup has no valid completion evidence"
          description: "Check the dr profile, rclone configuration and pg-backup-offsite logs. Enabling a service is not proof of remote completion."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNOffsiteBackupFailed
        expr: freesdn_pg_backup_offsite_last_attempt_failed == 1 and freesdn_pg_backup_offsite_required == 1
        for: 5m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "The latest off-site backup attempt failed verification"
          description: "Both database files and their completion marker must pass verification. A previous successful copy is retained as history only."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNOffsiteBackupStale
        expr: (time() - freesdn_pg_backup_offsite_source_timestamp > freesdn_pg_backup_offsite_max_age_seconds) and freesdn_pg_backup_offsite_required == 1
        for: 15m
        labels: {severity: critical, component: backup}
        annotations:
          summary: "The database pair verified off-site is too old"
          description: "Age is measured from the source backup, not the most recent copy. Copying the same old pair repeatedly cannot reset this alert."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"

      - alert: FreeSDNOffsiteRetentionFailed
        expr: freesdn_pg_backup_offsite_retention_failed == 1 and freesdn_pg_backup_offsite_required == 1
        for: 15m
        labels: {severity: warning, component: backup}
        annotations:
          summary: "Off-site backup retention failed"
          description: "Copy verification succeeded but old-object deletion failed. Check quota, permissions and object-lock policy; do not weaken retention protection automatically."
          runbook_url: "https://docs.freesdn.org/deploy/backups-and-restore/"
