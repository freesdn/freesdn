  # only hit is the declaration. metrics.py:153 says the depth gauge is
  # "updated by a periodic probe, see app.tasks.metrics"; app/tasks/metrics.py
  # exists and contains no such probe. A scrape returns the empty family, so
  # both expressions evaluate to no data and neither alert can ever fire.
  #
  # Shipping them meant an operator who wired this file into Alertmanager
  # believed they had Celery backlog and failure paging and had neither. That
  # is worse than having no rule, which is why they are off rather than
  # annotated.
  #
  # TO RE-ARM: uncomment this whole group the same commit that lands the
  # producers. Cheapest complete route (from the celeryobs handoff): a
