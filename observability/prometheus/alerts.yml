  # handlers for the counter. The counter additionally needs the WORKER
  # process scraped, i.e. a new target in docker/prometheus/prometheus.yml;
  # the queue-depth gauge does not, because the API can read Redis itself.
  # tests/tasks/test_observability_metrics_have_producers.py fails the moment
